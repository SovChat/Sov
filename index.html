<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOV chat</title>
        <link rel="stylesheet" href="lib/katex/katex.min.css">
        <script src="lib/katex/katex.min.js"></script>
        <link rel="stylesheet" href="style.css">
</head>
<body data-auth="locked">

<div class="chat-app" id="app">

    <!-- Header -->
    <div class="chat-header">
        <div class="header-left">
            <div class="server-icon">#</div>
            <div class="channel-info">
                <span class="channel-name" id="channelName">general</span>
                <span class="channel-tag" id="channelTag">--</span>
                <span class="online-badge"><span class="dot"></span> <span id="onlineCount">1</span></span>
            </div>
        </div>
                <div class="header-right">
            <div class="user-chip" id="userChip" hidden>
                <span class="user-avatar" id="userChipAvatar">?</span>
                <span class="user-name" id="userChipName">未登录</span>
                <button class="icon-btn" id="logoutBtn" type="button" aria-label="退出登录" title="退出登录">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
            <div class="theme-toggle-group">
                <button class="theme-btn" id="themeAuto">自适应</button>
                <button class="theme-btn" id="themeLight">白天</button>
                <button class="theme-btn" id="themeDark">黑夜</button>
            </div>
            <button class="icon-btn" aria-label="搜索">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="icon-btn" aria-label="添加成员">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="chat-body">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="section-label">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    频道
                </div>
                <div class="sidebar-item active" data-channel="general">
                    <span class="icon"><svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></span>
                    general
                </div>
                <div class="sidebar-item" data-channel="开发">
                    <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                    开发
                </div>
                <div class="sidebar-item" data-channel="语音">
                    <span class="icon"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
                    语音
                </div>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">
                <div class="section-label">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    成员 — <span id="memberCount">1</span>
                </div>
                <div id="memberList">
                <div class="member-item" id="selfMemberItem">
                    <span class="avatar" id="selfMemberAvatar">Y</span>
                    <span class="member-name" id="selfMemberName">You</span>
                    <span class="status-dot status-online"></span>
                </div>
                </div>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section" id="pendingSection" hidden>
                <div class="section-label">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    待审批 — <span id="pendingCount">0</span>
                </div>
                <div id="pendingList"></div>
            </div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section">
                <div class="section-label">
                    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    组织
                </div>
                <div class="sidebar-item" style="color: var(--text-muted);">
                    <span class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>
                    Mr · Org
                </div>
            </div>
        </div>

        <!-- Message Area（动态渲染） -->
        <div class="message-area" id="messageArea">
            <div class="empty-state" id="emptyState">暂无消息，发送第一条消息吧</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
        <div class="input-wrapper">
            <span class="input-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>
            <textarea id="msgInput" placeholder="发送消息..." rows="1" autocomplete="off"></textarea>
            <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="6" height="6"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
            <button type="button" class="send-icon" id="sendBtn" aria-label="发送">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- 登录 / 注册浮层：未登录时覆盖在聊天界面之上 -->
<div class="auth-overlay" id="authOverlay">
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <div class="auth-brand">
            <div class="server-icon">#</div>
            <div class="auth-brand-text">
                <h1 id="authTitle">SOV chat</h1>
                <p class="auth-sub" id="authGroupInfo">正在连接服务器…</p>
            </div>
        </div>

        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" data-auth-tab="login" id="tabLogin">登录</button>
            <button type="button" class="auth-tab" data-auth-tab="register" id="tabRegister">注册</button>
        </div>

        <form id="authForm" novalidate>
            <label class="auth-field">
                <span class="auth-label">用户名</span>
                <input id="authUserId" type="text" autocomplete="username" maxlength="64"
                       placeholder="字母、数字、下划线或连字符" required>
            </label>
            <label class="auth-field" id="authDisplayRow" hidden>
                <span class="auth-label">显示名</span>
                <input id="authDisplayName" type="text" autocomplete="nickname" maxlength="32"
                       placeholder="留空则与用户名相同">
            </label>
            <label class="auth-field">
                <span class="auth-label">密码</span>
                <input id="authPassword" type="password" autocomplete="current-password" minlength="6"
                       placeholder="至少 6 位" required>
            </label>
            <label class="auth-field" id="authConfirmRow" hidden>
                <span class="auth-label">确认密码</span>
                <input id="authConfirm" type="password" autocomplete="new-password" minlength="6"
                       placeholder="再次输入密码">
            </label>

            <div class="auth-error" id="authError" hidden></div>
            <div class="auth-note" id="authNote" hidden></div>

            <button type="submit" class="auth-submit" id="authSubmit">登录</button>
        </form>

        <p class="auth-hint" id="authHint"></p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>
</html>
